   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Favourite Florish | Admin</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');

    :root {
      --navy:#102a43;
      --navy-dark:#071d33;
      --blue:#1769d2;
      --blue-light:#4b91ed;

      --ice:#edf5fc;
      --ice2:#e2eff9;
      --paper:#f5f9fd;
      --card:#eef6fc;

      --text:#173047;
      --muted:#657b90;
      --border:#cfdfec;

      --green:#26845c;
      --red:#c94a4a;

      --shadow:0 14px 40px rgba(16,42,67,.10);
      --shadow-lg:0 25px 65px rgba(16,42,67,.16);

      --radius:20px;
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      font-family:"DM Sans",sans-serif;
      background:
        radial-gradient(circle at 5% 10%,rgba(75,145,237,.10),transparent 28%),
        radial-gradient(circle at 95% 35%,rgba(23,105,210,.07),transparent 30%),
        var(--paper);
      color:var(--text);
      line-height:1.6;
    }

    button,
    input,
    select,
    textarea {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    /* TOP BAR */

    .topbar {
      min-height:76px;
      padding:14px 4%;
      background:linear-gradient(120deg,#071d33,#0d355c,#1769d2);
      color:white;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;

      position:sticky;
      top:0;
      z-index:1000;

      box-shadow:0 8px 30px rgba(7,29,51,.18);
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-icon {
      width:44px;
      height:44px;
      border-radius:13px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.13);
      font-size:24px;
    }

    .brand h1 {
      font-family:"Playfair Display",serif;
      font-size:1.2rem;
    }

    .brand small {
      color:#c8ddef;
      font-size:.7rem;
    }

    .site-btn {
      border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.1);
      color:white;
      padding:10px 15px;
      border-radius:11px;
      font-weight:700;
    }

    /* MAIN */

    .container {
      width:min(1200px,92%);
      margin:auto;
      padding:35px 0 70px;
    }

    /* WELCOME */

    .welcome {
      position:relative;
      overflow:hidden;

      padding:35px;
      margin-bottom:25px;

      border-radius:26px;

      background:
        linear-gradient(135deg,#dceefa,#edf6fc 55%,#d2e6f6);

      border:1px solid var(--border);
      box-shadow:var(--shadow);
    }

    .welcome:after {
      content:"🔨";
      position:absolute;
      right:45px;
      top:-8px;
      font-size:90px;
      opacity:.12;
      transform:rotate(-20deg);
    }

    .eyebrow {
      color:#1455a4;
      font-size:.75rem;
      font-weight:800;
      letter-spacing:1.4px;
      text-transform:uppercase;
    }

    .welcome h2 {
      font-family:"Playfair Display",serif;
      color:var(--navy);
      font-size:clamp(2rem,5vw,3rem);
      line-height:1.1;
      margin:7px 0 12px;
    }

    .welcome p {
      color:var(--muted);
      max-width:680px;
    }

    /* STATS */

    .stats {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-bottom:35px;
    }

    .stat {
      background:linear-gradient(145deg,#f4f9fd,#e5f1fa);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:22px;
      box-shadow:var(--shadow);
    }

    .stat-icon {
      font-size:27px;
      margin-bottom:8px;
    }

    .stat strong {
      display:block;
      font-size:1.9rem;
      color:var(--navy);
      line-height:1;
    }

    .stat span {
      color:var(--muted);
      font-size:.8rem;
    }

    /* SECTION TITLE */

    .section-title {
      margin-bottom:18px;
    }

    .section-title h2 {
      font-family:"Playfair Display",serif;
      color:var(--navy);
      font-size:2rem;
    }

    .section-title p {
      color:var(--muted);
      font-size:.9rem;
    }

    /* PRODUCT MANAGER */

    .manager {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      padding:25px;
      box-shadow:var(--shadow);
      margin-bottom:30px;
    }

    .manager-top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      margin-bottom:22px;
    }

    .manager-top h2 {
      font-family:"Playfair Display",serif;
      color:var(--navy);
    }

    .add-btn {
      border:0;
      background:linear-gradient(135deg,var(--blue),var(--blue-light));
      color:white;
      padding:12px 18px;
      border-radius:12px;
      font-weight:800;
      box-shadow:0 8px 20px rgba(23,105,210,.22);
    }

    /* SEARCH */

    .filters {
      display:grid;
      grid-template-columns:1fr 220px;
      gap:12px;
      margin-bottom:22px;
    }

    input,
    select,
    textarea {
      width:100%;
      border:1px solid var(--border);
      background:#e8f2fa;
      color:var(--text);
      border-radius:12px;
      padding:12px 14px;
      outline:none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color:var(--blue-light);
      box-shadow:0 0 0 4px rgba(75,145,237,.10);
    }

    /* PRODUCTS */

    .products {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:17px;
    }

    .product {
      background:linear-gradient(145deg,#f7fbfe,#e5f1fa);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      transition:.2s ease;
    }

    .product:hover {
      transform:translateY(-4px);
      box-shadow:var(--shadow);
      border-color:#9fc3e3;
    }

    .product-visual {
      height:130px;
      border-radius:14px;
      background:
        radial-gradient(circle at 25% 25%,rgba(75,145,237,.18),transparent 35%),
        #dcebf7;

      display:grid;
      place-items:center;

      font-size:52px;
      margin-bottom:15px;
    }

    .product h3 {
      color:var(--navy);
      margin-bottom:4px;
    }

    .product-category {
      color:#2566a8;
      font-size:.75rem;
      font-weight:800;
    }

    .product-price {
      margin-top:10px;
      font-weight:800;
      color:var(--blue);
    }

    .availability {
      display:inline-block;
      margin-top:8px;
      padding:5px 9px;
      border-radius:999px;
      background:#dff1e8;
      color:var(--green);
      font-size:.7rem;
      font-weight:800;
    }

    .availability.unavailable {
      background:#f6dddd;
      color:var(--red);
    }

    .product-actions {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:15px;
    }

    .edit-btn {
      border:0;
      background:#d9eafb;
      color:#1459a8;
      padding:9px;
      border-radius:10px;
      font-weight:800;
    }

    .delete-btn {
      border:0;
      background:#f5dddd;
      color:#b63f3f;
      padding:9px;
      border-radius:10px;
      font-weight:800;
    }

    /* MODAL */

    .modal {
      position:fixed;
      inset:0;
      z-index:2000;

      background:rgba(7,29,51,.55);
      backdrop-filter:blur(5px);

      display:none;
      align-items:center;
      justify-content:center;

      padding:20px;
    }

    .modal.show {
      display:flex;
    }

    .modal-box {
      width:min(600px,100%);
      max-height:90vh;
      overflow-y:auto;

      background:#edf6fc;
      border:1px solid var(--border);
      border-radius:24px;
      padding:27px;
      box-shadow:var(--shadow-lg);
    }

      display:flex;
      justify-content:space
